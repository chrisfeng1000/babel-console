<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babel 控制台</title>
<style>
:root{
  --bg:#0a0c12; --bg2:#0e1118; --surf:#151a24; --surf2:#1a2130; --line:#242c3a;
  --tx:#e9edf4; --mut:#8893a7; --acc:#7c6cff; --acc2:#9d7bff;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:
  radial-gradient(1200px 600px at 80% -10%,rgba(124,108,255,.10),transparent 60%),var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
#mtop{display:none;align-items:center;gap:12px;padding:11px 15px;background:rgba(14,17,24,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#mtop button{background:transparent;border:0;color:var(--tx);font-size:21px;cursor:pointer;padding:0 2px}
#mtop b{font-weight:700;letter-spacing:.3px}
#wrap{flex:1;display:flex;min-height:0}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9}
#side{width:236px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:16px 18px 12px;font-weight:700;letter-spacing:.3px;font-size:15px}
.brand .lg{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:14px}
.conn{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;padding:0 18px 10px}
.conn .d{width:7px;height:7px;border-radius:50%;background:var(--mut);box-shadow:0 0 6px currentColor}
nav{padding:6px 10px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:1px 0;border:0;border-radius:10px;background:transparent;color:#c3cad8;font:inherit;cursor:pointer;transition:.12s}
nav button:hover{background:var(--surf)}
nav button.on{background:linear-gradient(90deg,rgba(124,108,255,.22),rgba(124,108,255,.06));color:#fff;box-shadow:inset 2px 0 0 var(--acc)}
nav button .ic{width:18px;text-align:center}
.spacer{flex:1}
.foot{padding:10px 18px;font-size:11px;color:var(--mut);border-top:1px solid var(--line)}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.view{flex:1;display:none;flex-direction:column;min-height:0}.view.on{display:flex}
.pane{flex:1;overflow-y:auto;padding:18px}
h2.title{margin:2px 2px 14px;font-size:17px;font-weight:700}
.sub{color:var(--mut);font-size:12.5px;font-weight:400;margin-left:8px}
/* bento */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
.tile{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);border-radius:16px;padding:15px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tile.span2{grid-column:span 2}
.tile h3{margin:0;font-size:13px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:7px;letter-spacing:.2px}
.tile .num{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.tile .click{cursor:pointer}
.row{display:flex;align-items:center;gap:9px;padding:5px 0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 7px currentColor}
.nm{flex:1;font-size:13px}.det{color:var(--mut);font-size:12px}
.bar{height:8px;border-radius:5px;background:#0c0f16;border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.p-ok{background:rgba(52,211,153,.16);color:var(--ok)}.p-warn{background:rgba(251,191,36,.16);color:var(--warn)}.p-bad{background:rgba(248,113,113,.16);color:var(--bad)}.p-mut{background:#222a38;color:var(--mut)}
.tbtn{align-self:flex-start;padding:7px 12px;border:1px solid var(--line);background:var(--surf);color:#cdd6e6;border-radius:9px;font:inherit;font-size:12.5px;cursor:pointer;transition:.12s}
.tbtn:hover{border-color:var(--acc);color:#fff}
.tbtn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
.li{font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:8px;align-items:flex-start}
.li:last-child{border:0}
.mut{color:var(--mut);font-size:12.5px}
/* chat */
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:min(720px,92%);padding:10px 14px;border-radius:15px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:var(--surf2);border:1px solid var(--line);border-bottom-left-radius:5px}
.tool{align-self:flex-start;font-size:12px;color:var(--mut);padding:0 4px}
.err{align-self:flex-start;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#fca5a5}
.sys{align-self:center;font-size:12px;color:var(--mut);text-align:center;max-width:90%}
.composer{padding:12px;border-top:1px solid var(--line);background:var(--bg2);display:flex;gap:9px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
textarea,.inp{flex:1;resize:none;height:46px;max-height:150px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.send{padding:0 18px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;cursor:pointer}
.send:disabled{opacity:.5}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.card h3{margin:0 0 11px;font-size:14px}
.refresh{float:right;font-size:12px;color:var(--mut);cursor:pointer;background:transparent;border:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.xbtn{padding:3px 10px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fca5a5;border-radius:7px;font-size:12px;cursor:pointer}
.chk{width:21px;height:21px;border:1.5px solid #3a4454;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ok);font-size:13px;flex-shrink:0}
.chk.on{background:rgba(52,211,153,.14);border-color:var(--ok)}
.ttext{flex:1;word-break:break-word}.ttext.done{color:var(--mut);text-decoration:line-through}
pre.detail{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;color:#aeb8c8;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:7px 0 0;max-height:300px;overflow:auto}
@media(max-width:780px){
  #mtop{display:flex}
  #side{position:fixed;z-index:10;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .22s;box-shadow:4px 0 24px rgba(0,0,0,.5)}
  #side.open{transform:none}
  #backdrop.show{display:block}
  .grid{grid-template-columns:1fr}
  .tile.span2{grid-column:span 1}
  .msg{max-width:100%}
}
</style></head><body>
<div id="mtop"><button id="ham">☰</button><span class="dot" id="dot2" style="background:var(--mut)"></span><b>Babel 控制台</b></div>
<div id="wrap">
  <aside id="side">
    <div class="brand"><span class="lg">⬡</span>Babel 控制台</div>
    <div class="conn"><span class="d" id="dot"></span><span id="sub">连接中…</span></div>
    <nav>
      <button data-v="dash" class="on"><span class="ic">▦</span>控制台</button>
      <button data-v="chat"><span class="ic">💬</span>对话(主控)</button>
      <button data-v="todo"><span class="ic">✓</span>待办 / 今日</button>
      <button data-v="mail"><span class="ic">✉</span>邮件</button>
      <button data-v="server"><span class="ic">▤</span>服务器 / 算力</button>
      <button data-v="reports"><span class="ic">▣</span>报告</button>
      <button data-v="fix"><span class="ic">🛠</span>网页维修助手</button>
    </nav>
    <div class="spacer"></div>
    <div class="foot">一体化工作助手 · GPU 调度 · 待办 · 邮件</div>
  </aside>
  <div id="backdrop"></div>
  <main>
    <div class="view on" id="v-dash"><div class="pane">
      <h2 class="title">控制台 <span class="sub" id="dash-sub"></span></h2>
      <div class="grid" id="dash"><div class="mut">加载中…</div></div>
    </div></div>
    <div class="view" id="v-chat"><div class="log" id="log-main"></div>
      <div class="composer"><textarea id="box-main" placeholder="跟主控 agent 说话:查状态、调卡、跑/停任务、记待办…(Enter 发送)"></textarea><button class="send" id="send-main">发送</button></div></div>
    <div class="view" id="v-todo"><div class="pane">
      <h2 class="title">待办 / 今日 <span class="sub">随手记 · AI 可帮你整理排序</span></h2>
      <div class="card">
        <div style="display:flex;gap:9px;margin-bottom:12px"><input class="inp" id="todo-in" style="height:42px" placeholder="加一条待办,回车…"><button class="tbtn" onclick="addTodo()">加</button></div>
        <div style="margin-bottom:12px"><button class="tbtn acc" onclick="askMain('看一下我现在的待办清单,帮我按紧急/重要排个优先级,告诉我今天先做哪几件。')">🤖 让 AI 帮我排优先级</button></div>
        <div id="todo-list"><div class="mut">加载中…</div></div>
      </div></div></div>
    <div class="view" id="v-mail"><div class="pane">
      <h2 class="title">邮件 <span class="sub">最近往来 · AI 可整理成待办</span></h2>
      <div class="card">
        <div style="margin-bottom:12px"><button class="tbtn acc" onclick="askMain('读最近的邮件活动(/home/hanqif/agent 的 mailbot 日志),把其中需要我做的事整理成待办,写进 webchat/todos.json。做完告诉我加了哪几条。')">🤖 让 AI 把邮件整理成待办</button></div>
        <div id="mail-list" class="mut">加载中…</div>
      </div></div></div>
    <div class="view" id="v-server"><div class="pane" id="pane-server"><div class="mut">加载中…</div></div></div>
    <div class="view" id="v-reports"><div class="pane" id="pane-reports"><div class="mut">加载中…</div></div></div>
    <div class="view" id="v-fix"><div class="log" id="log-fix"><div class="sys">网页维修助手:网页哪里不好用、想改配色/加功能,在这直接说,它会改前端并自动部署。</div></div>
      <div class="composer"><textarea id="box-fix" placeholder="网页有问题或想改哪?告诉维修助手…(Enter 发送)"></textarea><button class="send" id="send-fix">发送</button></div></div>
  </main>
</div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const dots=[document.getElementById('dot'),document.getElementById('dot2')];
let BACKEND='';
const EXPNAME={'8B@A100-80G':'8B 忠实版 · A100-80G','preview-any':'4B 预览 · 抢任意空卡','4B@A100-40G':'4B · A100-40G'};
const expLabel=t=>EXPNAME[t]||t;
const HCOL={ok:'var(--ok)',warn:'var(--warn)',down:'var(--bad)'};
function api(p){return BACKEND+p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(token)}
function j(p){return fetch(api(p),{cache:'no-store'}).then(r=>r.json())}
function setDot(c){dots.forEach(d=>{if(d)d.style.background=c})}
function setSub(t){const s=document.getElementById('sub');if(s)s.textContent=t}
function el(c,t,p){const d=document.createElement('div');d.className=c;if(t!=null)d.textContent=t;if(p)p.appendChild(d);return d}
const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function pill(s){return {ok:'p-ok',warn:'p-warn',down:'p-bad'}[s]||'p-mut'}

async function resolveBackend(){
  if(!token){setSub('缺 token');return false}
  try{
    if(location.hostname.endsWith('github.io')){const r=await fetch('backend.txt?t='+Date.now(),{cache:'no-store'});BACKEND=(await r.text()).trim().replace(/\/+$/,'')}
    else{BACKEND=location.origin}
    const p=await fetch(api('/ping'),{cache:'no-store'});const ok=p.ok;setDot(ok?'var(--ok)':'var(--bad)');setSub(ok?'已连接':'后端离线');return ok
  }catch(e){setDot('var(--bad)');setSub('后端离线,稍后自动重连');return false}
}

// ===== 控制台 bento =====
function nav(v){document.querySelector('nav button[data-v='+v+']').click()}
async function loadDash(){if(!BACKEND)return;const g=document.getElementById('dash');
  try{
    const [h,td,ml]=await Promise.all([j('/api/health'),j('/api/todos'),j('/api/mail')]);
    const cs=h.components||[];
    const find=n=>cs.find(c=>c.name===n)||{status:'warn',detail:''};
    const babel=find('Babel 集群'), exps=cs.filter(c=>c.name.startsWith('实验 '));
    const servers=cs.filter(c=>['Babel 集群','shap0','shap1','网页后端','自动循环'].includes(c.name));
    const todos=td.todos||[], undone=todos.filter(t=>!t.done);
    let h2='';
    // 健康总览
    h2+='<div class="tile span2 click" onclick="nav(\'server\')"><h3>🩺 系统健康</h3><div class="num" style="color:'+(h.ok?'var(--ok)':'var(--bad)')+'">'+(h.ok?'全部正常':h.issues+' 项有问题')+'</div><div>'+servers.map(c=>'<span style="display:inline-flex;align-items:center;gap:4px;margin:3px 10px 3px 0;font-size:12px;color:var(--mut)"><span class="dot" style="color:'+HCOL[c.status]+';background:'+HCOL[c.status]+'"></span>'+esc(c.name.replace(' 集群',''))+'</span>').join('')+'</div></div>';
    // 算力
    const gm=(babel.detail.match(/空闲 (\d+) \/ 共 (\d+)/)||[0,0,0]);const av=+gm[1],tot=+gm[2],pct=tot?Math.round((tot-av)/tot*100):0;
    h2+='<div class="tile click" onclick="nav(\'server\')"><h3>🖥 Babel 算力</h3><div class="num">'+av+'<span style="font-size:15px;color:var(--mut)"> / '+tot+' 空闲</span></div><div class="bar"><span class="fill" style="width:'+pct+'%"></span></div><div class="det">已用 '+pct+'%</div></div>';
    // 服务器
    h2+='<div class="tile click" onclick="nav(\'server\')"><h3>🌐 服务器</h3>'+['Babel 集群','shap0','shap1'].map(n=>{const c=find(n);return '<div class="row"><span class="dot" style="color:'+HCOL[c.status]+';background:'+HCOL[c.status]+'"></span><span class="nm">'+esc(n.replace(' 集群',''))+'</span><span class="pill '+pill(c.status)+'">'+(c.status==='ok'?'正常':c.status==='warn'?'紧张':'离线')+'</span></div>'}).join('')+'</div>';
    // 实验
    h2+='<div class="tile click" onclick="nav(\'server\')"><h3>🧪 实验</h3>'+(exps.length?exps.map(c=>'<div class="row"><span class="dot" style="color:'+HCOL[c.status]+';background:'+HCOL[c.status]+'"></span><span class="nm">'+esc(expLabel(c.name.replace('实验 ','')))+'</span></div><div class="det" style="margin:-4px 0 6px 18px">'+esc(c.detail)+'</div>').join(''):'<div class="mut">暂无</div>')+'</div>';
    // 待办
    h2+='<div class="tile"><h3>✓ 待办 <span style="color:var(--mut)">('+undone.length+' 未完成)</span></h3>'+(undone.slice(0,4).map(t=>'<div class="li">· '+esc(t.text)+'</div>').join('')||'<div class="mut">今天没有待办 🎉</div>')+'<button class="tbtn" style="margin-top:6px" onclick="nav(\'todo\')">打开待办 →</button></div>';
    // 邮件
    h2+='<div class="tile"><h3>✉ 邮件活动</h3>'+((ml.lines||[]).slice(-4).reverse().map(l=>'<div class="li" style="color:var(--mut);font-size:12px">'+esc(l)+'</div>').join('')||'<div class="mut">无</div>')+'<button class="tbtn" style="margin-top:6px" onclick="nav(\'mail\')">打开邮件 →</button></div>';
    // 快速提问
    h2+='<div class="tile span2"><h3>⚡ 快速问主控</h3><div style="display:flex;gap:9px"><input class="inp" id="dash-ask" style="height:42px" placeholder="例:现在有几张 80G 空卡?帮我记个待办…"><button class="send" style="border-radius:12px" onclick="dashAsk()">问</button></div></div>';
    g.innerHTML=h2;
    document.getElementById('dash-sub').textContent='更新于 '+new Date().toLocaleTimeString();
    const di=document.getElementById('dash-ask');if(di)di.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();dashAsk()}});
  }catch(e){g.innerHTML='<div class="mut">加载失败,后端可能在重连,稍候…</div>'}
}
function dashAsk(){const i=document.getElementById('dash-ask');if(i&&i.value.trim()){askMain(i.value.trim());i.value=''}}
function askMain(text){nav('chat');const b=document.getElementById('box-main');b.value=text;document.getElementById('send-main').click()}

// ===== 聊天(带抗断重试)=====
function makeChat(logId,boxId,sendId,mode){
  const log=document.getElementById(logId),box=document.getElementById(boxId),send=document.getElementById(sendId);
  const HKEY='babel_chat_'+mode;
  function saveHist(){try{const a=[...log.querySelectorAll('.msg.user,.msg.bot')].map(m=>({r:m.classList.contains('user')?'u':'b',t:m.textContent}));localStorage.setItem(HKEY,JSON.stringify(a.slice(-150)))}catch(e){}}
  (function loadHist(){try{const a=JSON.parse(localStorage.getItem(HKEY)||'[]');if(!a.length)return;a.forEach(m=>el('msg '+(m.r==='u'?'user':'bot'),m.t,log));el('sys','— 以上为历史记录,新消息在下方 —',log);log.scrollTop=log.scrollHeight}catch(e){}})();
  function stream(msg,bot,attempt){let full='',wd=null;
    const es=new EventSource(api('/api/stream?mode='+mode+'&msg='+encodeURIComponent(msg)));
    const arm=()=>{clearTimeout(wd);wd=setTimeout(()=>{es.close();onfail(msg,bot,full,attempt)},150000)};arm();
    es.addEventListener('text',e=>{full+=JSON.parse(e.data);bot.textContent=full;bot.className='msg bot';log.scrollTop=log.scrollHeight;arm()});
    es.addEventListener('tool',e=>{el('msg tool','⚙ '+JSON.parse(e.data),log);log.scrollTop=log.scrollHeight;arm()});
    es.addEventListener('done',e=>{clearTimeout(wd);const d=JSON.parse(e.data);if(d.result)bot.textContent=d.result;bot.className='msg bot';if(d.cost){el('cost','≈$'+Number(d.cost).toFixed(3),bot)}saveHist();es.close();done()});
    es.addEventListener('error',()=>{clearTimeout(wd);es.close();onfail(msg,bot,full,attempt)});
  }
  function onfail(msg,bot,full,attempt){
    if(!full&&attempt<1){bot.className='msg bot';bot.textContent='(连接断了,正在自动重连…)';resolveBackend().finally(()=>setTimeout(()=>stream(msg,bot,attempt+1),1600));return}
    bot.className=full?'msg bot':'msg err';const tip=document.createElement('div');tip.style.cssText='font-size:12px;margin-top:5px;color:#9db4d6';
    tip.innerHTML=(full?'(回复中断,会话未丢)':'(连接中断)')+' <span style="cursor:pointer;text-decoration:underline">↻ 重试</span>';
    tip.querySelector('span').onclick=()=>{tip.remove();if(!full){bot.className='msg bot';bot.textContent='思考中…'}stream(msg,bot,0)};bot.appendChild(tip);done();
  }
  async function go(){const msg=box.value.trim();if(!msg)return;if(!BACKEND){await resolveBackend();if(!BACKEND){setSub('后端离线,稍等…');return}}
    el('msg user',msg,log);saveHist();log.scrollTop=log.scrollHeight;box.value='';send.disabled=true;box.disabled=true;setDot('var(--warn)');
    const bot=el('msg bot','思考中…',log);log.scrollTop=log.scrollHeight;stream(msg,bot,0)}
  function done(){send.disabled=false;box.disabled=false;setDot('var(--ok)');box.focus()}
  send.onclick=go;box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
}

// ===== 待办 / 邮件 =====
async function loadTodos(){if(!BACKEND)return;const box=document.getElementById('todo-list');
  try{const d=await j('/api/todos');box.innerHTML='';
    if(!d.todos||!d.todos.length)box.innerHTML='<div class="mut">还没有待办。上面加一条,或在"对话"里说"记一下…"</div>';
    (d.todos||[]).forEach(t=>{const r=el('row',null,box);r.innerHTML='<span class="chk'+(t.done?' on':'')+'">'+(t.done?'✓':'')+'</span><span class="ttext'+(t.done?' done':'')+'">'+esc(t.text)+'</span><span class="xbtn">删</span>';
      r.querySelector('.chk').onclick=()=>tg(t.id);r.querySelector('.xbtn').onclick=()=>dl(t.id)})
  }catch(e){box.innerHTML='<div class="msg err">拿待办失败</div>'}}
async function addTodo(){const i=document.getElementById('todo-in');const t=i.value.trim();if(!t||!BACKEND)return;i.value='';try{await j('/api/todo/add?text='+encodeURIComponent(t))}catch(e){}loadTodos()}
async function tg(id){try{await j('/api/todo/toggle?id='+id)}catch(e){}loadTodos()}
async function dl(id){try{await j('/api/todo/del?id='+id)}catch(e){}loadTodos()}
async function loadMail(){const box=document.getElementById('mail-list');if(!box||!BACKEND)return;
  try{const d=await j('/api/mail');box.innerHTML=(d.lines||[]).slice().reverse().map(l=>'<div class="li" style="font-size:12.5px;color:#aeb8c8">'+esc(l)+'</div>').join('')||'<span class="mut">无</span>'}catch(e){}}

// ===== 服务器 / 算力(含健康详情)=====
async function cancelJob(jid){if(!confirm('确定取消作业 '+jid+'?'))return;try{const r=await j('/api/cancel?jid='+jid);alert(r.ok?'已取消 '+jid:'失败')}catch(e){alert('取消失败')}loadServer()}
async function jobDetail(jid,cell){if(cell.dataset.open){cell.dataset.open='';const p=cell.querySelector('pre');if(p)p.remove();return}
  try{const r=await j('/api/job?jid='+jid);const pre=document.createElement('pre');pre.className='detail';pre.textContent=r.detail||'(无)';cell.appendChild(pre);cell.dataset.open='1'}catch(e){}}
async function loadServer(){if(!BACKEND)return;const pane=document.getElementById('pane-server');
  try{const [st,h]=await Promise.all([j('/api/status'),j('/api/health')]);
    let x='<h2 class="title">服务器 / 算力 <span class="sub">实时;点作业号看详情、点"取消"停作业</span></h2><button class="refresh" onclick="loadServer()">↻ 刷新</button>';
    x+='<div class="card"><h3>系统健康 '+(h.ok?'<span class="pill p-ok">全部正常</span>':'<span class="pill p-bad">'+h.issues+' 项有问题</span>')+'</h3>';
    (h.components||[]).forEach(c=>{x+='<div class="row"><span class="dot" style="color:'+HCOL[c.status]+';background:'+HCOL[c.status]+'"></span><span class="nm" style="font-weight:600">'+esc(c.name.startsWith('实验 ')?'实验 '+expLabel(c.name.slice(3)):c.name)+'</span><span class="det">'+esc(c.detail)+'</span></div>'});x+='</div>';
    const b=st.babel||{};x+='<div class="card"><h3>Babel GPU · 空 '+(b.avail||0)+' / 共 '+(b.total||0)+'</h3>';
    const bt=b.by_type||{};Object.keys(bt).forEach(k=>{const v=bt[k];const pct=v.total?Math.round((v.total-v.avail)/v.total*100):0;x+='<div class="row"><span class="nm" style="min-width:110px">'+k+'</span><span class="bar" style="flex:1"><span class="fill" style="width:'+pct+'%;background:'+(v.avail>0?'linear-gradient(90deg,var(--acc),var(--acc2))':'#3a4454')+'"></span></span><span class="det" style="min-width:92px;text-align:right;color:'+(v.avail>0?'var(--ok)':'var(--mut)')+'">空 '+v.avail+' / '+v.total+'</span></div>'});x+='</div>';
    const js=st.jobs||[];x+='<div class="card"><h3>我的作业('+js.length+')</h3>';
    if(js.length){x+='<table><tr><th>job</th><th>名</th><th>状态</th><th>时长</th><th></th></tr>';js.forEach(jb=>{x+='<tr><td><span style="cursor:pointer;color:var(--acc2)" onclick="jobDetail(\''+jb.id+'\',this.parentElement)">'+jb.id+'</span></td><td>'+esc(jb.name)+'</td><td><span class="pill '+(jb.state==='RUNNING'?'p-ok':jb.state==='PENDING'?'p-warn':'p-mut')+'">'+esc(jb.state)+'</span></td><td class="det">'+esc(jb.time)+'</td><td><span class="xbtn" onclick="cancelJob(\''+jb.id+'\')">取消</span></td></tr>'});x+='</table>'}else x+='<div class="mut">队列里没有作业</div>';
    x+='</div>';pane.innerHTML=x
  }catch(e){pane.innerHTML='<div class="msg err">拿服务器状态失败,稍候重试</div>'}}
async function loadReports(){if(!BACKEND)return;const pane=document.getElementById('pane-reports');
  try{const d=await j('/api/reports');let x='<h2 class="title">报告 <span class="sub">循环定期写的执行报告</span></h2><button class="refresh" onclick="loadReports()">↻ 刷新</button>';
    (d.reports||[]).forEach(r=>{x+='<div class="card"><h3>'+esc(r.name)+'</h3><pre class="detail">'+esc(r.text)+'</pre></div>'});
    if(!(d.reports||[]).length)x+='<div class="mut">暂无报告</div>';pane.innerHTML=x
  }catch(e){pane.innerHTML='<div class="msg err">拿报告失败</div>'}}

// ===== 导航 + 抽屉 =====
const side=document.getElementById('side'),backdrop=document.getElementById('backdrop');
function closeDrawer(){side.classList.remove('open');backdrop.classList.remove('show')}
document.getElementById('ham').onclick=()=>{side.classList.toggle('open');backdrop.classList.toggle('show')};
backdrop.onclick=closeDrawer;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const v=b.dataset.v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById('v-'+v).classList.add('on');
  ({dash:loadDash,todo:loadTodos,mail:loadMail,server:loadServer,reports:loadReports}[v]||(()=>{}))();closeDrawer()});

(async()=>{await resolveBackend();makeChat('log-main','box-main','send-main','main');makeChat('log-fix','box-fix','send-fix','maintain');
  document.getElementById('todo-in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTodo()}});
  loadDash();setInterval(()=>{if(document.getElementById('v-dash').classList.contains('on'))loadDash()},20000);
  setInterval(resolveBackend,25000);
})();
</script></body></html>
